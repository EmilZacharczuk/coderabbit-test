<!DOCTYPE html>
<html>
<head>
  <title>Simple Website</title>
</head>
<body>
  <h1>Welcome to My Simple Website</h1>
  <p id="greeting">Click the button to see a greeting.</p>
  <button onclick="showGreeting()">Say Hello</button>

  <script>
    function showGreeting() {
      document.getElementById('greeting').innerText = 'Hello, visitor! Have a great day!';
    }
  </script>
</body>
</html>
